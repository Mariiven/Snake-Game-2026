<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Jogos</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0f0a1f; color: #f0f0f0;
         font-family: system-ui, Arial, sans-serif; padding: 32px 16px; }
  main { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { margin: 0 0 8px; font-size: 2em; }
  header p { margin: 0; color: #afbdff; }
  .cardapio { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { display: block; background: rgb(36, 25, 58); border: 2px solid #3b2f63; border-radius: 16px;
          padding: 24px 20px; color: inherit; text-decoration: none; text-align: center;
          transition: transform .2s, border-color .2s, box-shadow .2s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-4px); border-color: #7AF0ED;
          box-shadow: 0 8px 24px rgba(0,0,0,.5); outline: none; }
  .card .icone { font-size: 3em; margin-bottom: 8px; }
  .card h2 { margin: 0 0 6px; font-size: 1.2em; }
  .card p { margin: 0 0 14px; font-size: .9em; color: #c9c4e0; }
  .card .acao { display: inline-block; background: #689cd6; color: #fff; padding: 8px 20px; border-radius: 8px; font-size: .9em; }
  .card.breve { opacity: .5; border-style: dashed; }
  .card.breve .acao { background: #3b2f63; }
  footer { text-align: center; margin-top: 40px; font-size: .85em; color: #8a85a8; }
</style>
</head>
<body>
<main>
  <header>
    <h1>&#127918; Portal de Jogos</h1>
    <p>Escolha um jogo e divirta-se.</p>
  </header>

  <section class="cardapio" aria-label="Jogos disponíveis">
    <a class="card" href="jogos/cobrinha/">
      <div class="icone">&#127775;</div>
      <h2>Devoradores de Estrelas</h2>
      <p>Jogo da cobrinha com níveis, combos, obstáculos e três dificuldades.</p>
      <span class="acao">Jogar</span>
    </a>

    <!-- Para adicionar um jogo: copie um bloco <a class="card"> e aponte o href para jogos/nome-do-jogo/ -->
    <div class="card breve">
      <div class="icone">&#10060;</div>
      <h2>Jogo da Velha</h2>
      <p>Em breve.</p>
      <span class="acao">Em breve</span>
    </div>

    <div class="card breve">
      <div class="icone">&#129504;</div>
      <h2>Jogo da Memória</h2>
      <p>Em breve.</p>
      <span class="acao">Em breve</span>
    </div>
  </section>

  <footer>Feito com HTML, CSS e JavaScript.</footer>
</main>
</body>
</html>
